<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSI Professional Suite 📡 Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #0f172a; color: #f8fafc; overflow-x: hidden; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        #spectrogramCanvas { image-rendering: pixelated; width: 100%; height: 350px; border-radius: 8px; }
        #chartCanvas { width: 100%; height: 100px; border-radius: 8px; }
        #motionCanvas { display: none; } 
        .recording-indicator { animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <nav class="bg-slate-900 border-b border-slate-800 px-6 py-4 mb-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-400 flex items-center gap-2">
                CSI Professional Suite <span id="recIndicator" class="hidden text-red-500 text-xs flex items-center gap-1 recording-indicator">● REC</span>
            </h1>
            <div id="connectionStatus" class="flex items-center gap-2 bg-slate-800 px-3 py-1 rounded-full border border-slate-700">
                <span class="status-dot bg-amber-400"></span>
                <span class="text-xs text-slate-400 uppercase tracking-widest font-bold">Connecting</span>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6">
        <!-- Dashboard Tiles -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
            <div class="card p-6 text-center">
                <div class="text-[10px] text-slate-500 uppercase font-bold tracking-widest mb-1">RSSI (Raw)</div>
                <div id="rssiVal" class="text-4xl font-bold text-blue-400">--</div>
            </div>
            <div class="card p-6 text-center border-l-4 border-l-blue-500 shadow-xl shadow-blue-900/10">
                <div class="text-[10px] text-slate-500 uppercase font-bold tracking-widest mb-1">Movement Index</div>
                <div id="moveVal" class="text-4xl font-bold text-white">0.00</div>
                <div id="moveStatus" class="text-[10px] mt-1 uppercase text-slate-600">Static</div>
            </div>
            <div class="card p-6 text-center">
                <div class="text-[10px] text-slate-500 uppercase font-bold tracking-widest mb-1">Total Frames</div>
                <div id="frameVal" class="text-4xl font-bold text-slate-300">0</div>
            </div>
            <div class="card p-4">
                <div class="text-[10px] text-slate-500 uppercase font-bold tracking-widest mb-2">Signature Library</div>
                <div id="videoGallery" class="flex gap-2 overflow-x-auto w-full min-h-[50px]">
                    <div class="text-slate-700 text-[9px] italic flex items-center justify-center w-full">Capture motion...</div>
                </div>
            </div>
        </div>

        <!-- Diagnostic Spectrogram -->
        <div class="card p-6 mb-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-widest">Diagnostic Spectrogram (History)</h3>
                <div class="text-[10px] text-slate-600 font-mono">BLUE: LOW | RED: HIGH INTENSITY</div>
            </div>
            <div class="bg-black p-1 rounded-lg border border-slate-700">
                <canvas id="spectrogramCanvas"></canvas>
            </div>
        </div>

        <!-- Intensity Timeline -->
        <div class="card p-6 mb-6">
            <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-widest mb-4">Movement Intensity Timeline</h3>
            <div class="bg-slate-900 p-2 rounded-lg border border-slate-800">
                <canvas id="chartCanvas"></canvas>
            </div>
        </div>

        <!-- Hidden Cinema Engine -->
        <canvas id="motionCanvas" width="400" height="400"></canvas>

        <!-- Footer -->
        <div class="flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800">
            <button onclick="calibrate()" class="px-8 py-2 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-500 transition-all shadow-lg shadow-blue-900/40">RECALIBRATE FIELD</button>
            <div class="text-[10px] text-slate-600 font-mono uppercase">
                Engine: High-Res EMA | Mode: Full-Power Suite
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let specCanvas, specCtx, chartCanvas, chartCtx, motionCanvas, mCtx;
        let chartData = new Array(200).fill(0);
        let motionEma = new Array(64).fill(0);
        let isMovingActive = false;
        let mediaRecorder = null, recordedChunks = [];
        let sweepSpeed = 2;

        function init() {
            specCanvas = document.getElementById('spectrogramCanvas');
            specCtx = specCanvas.getContext('2d');
            chartCanvas = document.getElementById('chartCanvas');
            chartCtx = chartCanvas.getContext('2d');
            motionCanvas = document.getElementById('motionCanvas');
            mCtx = motionCanvas.getContext('2d');

            resize();
            window.addEventListener('resize', resize);
            connectWebSocket();
        }

        function drawSpectrogram(bins) {
            const w = specCanvas.width, h = specCanvas.height;
            const binH = h / 32; // 32 Doppler bins
            const img = specCtx.getImageData(sweepSpeed, 0, w - sweepSpeed, h);
            specCtx.putImageData(img, 0, 0);
            
            bins.forEach((val, i) => {
                const alpha = Math.min(1, val * 12);
                const hue = 220 - (val * 200); 
                specCtx.fillStyle = `hsla(${hue}, 100%, ${20 + val * 70}%, ${alpha})`;
                specCtx.fillRect(w - sweepSpeed, h - (i + 1) * binH, sweepSpeed, binH);
            });

            // Doppler Labels
            specCtx.font = "8px Outfit";
            specCtx.fillStyle = "rgba(255,255,255,0.3)";
            specCtx.fillText("HIGH FREQUENCY (FAST)", 10, 15);
            specCtx.fillText("LOW FREQUENCY (SLOW)", 10, h - 5);
        }

        function drawChart(val) {
            chartData.push(val);
            if (chartData.length > 150) chartData.shift();
            const w = chartCanvas.width, h = chartCanvas.height;
            chartCtx.clearRect(0, 0, w, h);
            
            // AUTO-SCALE: use the max of the last 150 samples so small movements are visible
            const maxVal = Math.max(...chartData, 0.1);

            chartCtx.beginPath();
            chartCtx.strokeStyle = '#3b82f6';
            chartCtx.lineWidth = 2;
            const step = w / chartData.length;
            chartData.forEach((d, i) => {
                const y = h - (d / maxVal) * h * 0.95;
                if (i === 0) chartCtx.moveTo(0, y);
                else chartCtx.lineTo(i * step, y);
            });
            chartCtx.stroke();
            chartCtx.lineTo(w, h); chartCtx.lineTo(0, h);
            chartCtx.fillStyle = 'rgba(59, 130, 246, 0.1)';
            chartCtx.fill();
        }

        function drawMotionFrame(bins) {
            const w = motionCanvas.width, h = motionCanvas.height;
            const binH = h / 64;
            const barW = 120;
            const startX = (w - barW) / 2;
            mCtx.fillStyle = '#000000';
            mCtx.fillRect(0, 0, w, h);
            bins.forEach((val, i) => {
                motionEma[i] = (0.8 * val) + (0.2 * motionEma[i]);
                const sv = motionEma[i];
                if (sv > 0.01) {
                    const alpha = Math.min(1, sv * 12);
                    const hue = 220 - (sv * 200);
                    mCtx.fillStyle = `hsla(${hue}, 100%, ${20 + sv * 70}%, ${alpha})`;
                    mCtx.fillRect(startX, h - (i + 1) * binH, barW, binH);
                }
            });
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
            ws.onopen = () => { document.querySelector('.status-dot').className = 'status-dot bg-green-500'; };
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'calibrating') { document.getElementById('moveVal').textContent = 'CAL...'; return; }
                
                document.getElementById('rssiVal').textContent = data.rssi;
                document.getElementById('moveVal').textContent = data.movement_value.toFixed(2);
                document.getElementById('frameVal').textContent = data.frame_count;
                
                const status = document.getElementById('moveStatus');
                status.textContent = data.movement_type;
                status.className = data.movement_type === 'MOVE' ? 'text-[10px] mt-1 uppercase text-blue-400 font-bold' : 'text-[10px] mt-1 uppercase text-slate-600';

                if (data.subcarrier_map) {
                    drawSpectrogram(data.subcarrier_map);
                    drawChart(data.movement_value);
                    drawMotionFrame(data.subcarrier_map);
                }

                const isMoving = data.movement_type === 'MOVE';
                if (isMoving && !isMovingActive) { startRecording(); isMovingActive = true; } 
                else if (!isMoving && isMovingActive) { stopRecording(); isMovingActive = false; }
            };
        }

        function startRecording() {
            recordedChunks = [];
            document.getElementById('recIndicator').classList.remove('hidden');
            const stream = motionCanvas.captureStream(50);
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = saveVideo;
            mediaRecorder.start();
        }

        function stopRecording() { if (mediaRecorder) mediaRecorder.stop(); document.getElementById('recIndicator').classList.add('hidden'); }

        function saveVideo() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const gallery = document.getElementById('videoGallery');
            if (gallery.querySelector('div.italic')) gallery.innerHTML = '';
            const vid = document.createElement('video');
            vid.src = url; vid.className = 'w-full rounded border border-slate-700 cursor-pointer hover:border-blue-500';
            vid.loop = true; vid.muted = true;
            vid.onmouseenter = () => vid.play();
            vid.onmouseleave = () => { vid.pause(); vid.currentTime = 0; };
            vid.onclick = () => window.open(url);
            gallery.prepend(vid);
        }

        function resize() {
            [specCanvas, chartCanvas].forEach(c => { c.width = c.offsetWidth; c.height = c.offsetHeight; });
        }
        async function calibrate() { await fetch('/calibrate', { method: 'POST' }); }
        init();
    </script>
</body>
</html>
