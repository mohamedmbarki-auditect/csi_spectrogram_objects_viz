<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSI Diagnostic Dashboard 📡📊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #0f172a; color: #f8fafc; overflow-x: hidden; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        #spectrogramCanvas { image-rendering: pixelated; width: 100%; height: 350px; border-radius: 8px; }
        #chartCanvas { width: 100%; height: 120px; border-radius: 8px; }
    </style>
</head>
<body>
    <nav class="bg-slate-900 border-b border-slate-800 px-6 py-4 mb-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-400">CSI Diagnostic Analytics</h1>
            <div id="connectionStatus" class="flex items-center gap-2 bg-slate-800 px-3 py-1 rounded-full border border-slate-700">
                <span class="status-dot bg-amber-400"></span>
                <span class="text-xs text-slate-400 uppercase tracking-widest font-bold">Connecting</span>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6">
        <!-- Top Stats Row -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <div class="card p-6 flex flex-col items-center justify-center text-center">
                <div class="text-[10px] text-slate-500 uppercase tracking-widest mb-1 font-bold">Signal Strength (RSSI)</div>
                <div id="rssiVal" class="text-4xl font-bold text-blue-400">--</div>
                <div class="text-[10px] text-slate-600 mt-1">DBM (RAW)</div>
            </div>
            <div class="card p-6 flex flex-col items-center justify-center text-center border-l-4 border-l-blue-500">
                <div class="text-[10px] text-slate-500 uppercase tracking-widest mb-1 font-bold">Movement Index</div>
                <div id="moveVal" class="text-4xl font-bold text-white">0.00</div>
                <div class="text-[10px] text-slate-600 mt-1 uppercase" id="moveStatus">Static</div>
            </div>
            <div class="card p-6 flex flex-col items-center justify-center text-center">
                <div class="text-[10px] text-slate-500 uppercase tracking-widest mb-1 font-bold">Total Frames</div>
                <div id="frameVal" class="text-4xl font-bold text-slate-300">0</div>
                <div class="text-[10px] text-slate-600 mt-1 uppercase">CSI Samples</div>
            </div>
        </div>

        <!-- Main Spectrogram -->
        <div class="card p-6 mb-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-widest">CSI Amplitude Spectrogram (64 Subcarriers)</h3>
                <div class="text-[10px] text-slate-600 font-mono">TIME PROPAGATION →</div>
            </div>
            <div class="bg-black p-1 rounded-lg border border-slate-700 shadow-inner">
                <canvas id="spectrogramCanvas"></canvas>
            </div>
        </div>

        <!-- Intensity Chart -->
        <div class="card p-6 mb-6">
            <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-widest mb-4">Movement Intensity Timeline</h3>
            <div class="bg-slate-900 p-2 rounded-lg border border-slate-800">
                <canvas id="chartCanvas"></canvas>
            </div>
        </div>

        <!-- Control Footer -->
        <div class="flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800">
            <div class="flex gap-4">
                <button onclick="calibrate()" class="px-6 py-2 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-500 transition-all shadow-lg shadow-blue-900/40">RECALIBRATE FIELD</button>
                <button onclick="window.location.reload()" class="px-6 py-2 bg-slate-800 text-slate-300 rounded-lg font-bold hover:bg-slate-700 transition-all">REFRESH UI</button>
            </div>
            <div class="text-[10px] text-slate-600 font-mono uppercase">
                Hardware: ESP32-C3 | Serial: 921600 Baud | Engine: High-Res EMA
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let specCanvas, specCtx;
        let chartCanvas, chartCtx;
        let chartData = new Array(200).fill(0);
        let sweepSpeed = 2;

        function init() {
            specCanvas = document.getElementById('spectrogramCanvas');
            specCtx = specCanvas.getContext('2d');
            chartCanvas = document.getElementById('chartCanvas');
            chartCtx = chartCanvas.getContext('2d');

            resize();
            window.addEventListener('resize', resize);
            connectWebSocket();
            requestAnimationFrame(drawLoop);
        }

        function drawSpectrogram(bins) {
            const w = specCanvas.width, h = specCanvas.height;
            const binH = h / 64;

            // Shift
            const img = specCtx.getImageData(sweepSpeed, 0, w - sweepSpeed, h);
            specCtx.putImageData(img, 0, 0);
            
            // New Column
            bins.forEach((val, i) => {
                const alpha = Math.min(1, val * 5);
                const hue = 220 - (val * 200); // Blue to Red
                specCtx.fillStyle = `hsla(${hue}, 100%, 50%, ${alpha})`;
                specCtx.fillRect(w - sweepSpeed, h - (i + 1) * binH, sweepSpeed, binH);
            });
        }

        function drawChart(val) {
            chartData.push(val);
            if (chartData.length > 300) chartData.shift();

            const w = chartCanvas.width, h = chartCanvas.height;
            chartCtx.clearRect(0, 0, w, h);
            
            chartCtx.beginPath();
            chartCtx.strokeStyle = '#3b82f6';
            chartCtx.lineWidth = 2;
            chartCtx.lineJoin = 'round';
            
            const step = w / chartData.length;
            chartData.forEach((d, i) => {
                const y = h - (d / 10) * h;
                if (i === 0) chartCtx.moveTo(0, y);
                else chartCtx.lineTo(i * step, y);
            });
            chartCtx.stroke();

            // Fill
            chartCtx.lineTo(w, h);
            chartCtx.lineTo(0, h);
            chartCtx.fillStyle = 'rgba(59, 130, 246, 0.1)';
            chartCtx.fill();
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
            
            ws.onopen = () => {
                const dot = document.querySelector('.status-dot');
                dot.className = 'status-dot bg-green-500';
                document.querySelector('#connectionStatus span:last-child').textContent = 'Live';
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'calibrating') {
                    document.getElementById('moveVal').textContent = 'CAL...';
                    return;
                }

                document.getElementById('rssiVal').textContent = data.rssi;
                document.getElementById('moveVal').textContent = data.movement_value.toFixed(2);
                document.getElementById('frameVal').textContent = data.frame_count;
                
                const status = document.getElementById('moveStatus');
                status.textContent = data.movement_type;
                status.className = data.movement_type === 'MOVE' ? 'text-[10px] mt-1 uppercase text-blue-400 font-bold' : 'text-[10px] mt-1 uppercase text-slate-600';

                if (data.subcarrier_map) {
                    drawSpectrogram(data.subcarrier_map);
                    drawChart(data.movement_value);
                }
            };
        }

        function resize() {
            specCanvas.width = specCanvas.offsetWidth;
            specCanvas.height = specCanvas.offsetHeight;
            chartCanvas.width = chartCanvas.offsetWidth;
            chartCanvas.height = chartCanvas.offsetHeight;
        }

        async function calibrate() {
            await fetch('/calibrate', { method: 'POST' });
        }

        init();
    </script>
</body>
</html>
